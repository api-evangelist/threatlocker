    post:
      tags:
      - Computer
      summary: Updates a device's maintenance mode settings
      description: 'Use this endpoint to enable or disable specific maintenance modes for a device.


        **Maintenance Mode IDs:**

        * **Application Control Monitor**: `1`

        * **Application Control Installation**: `2`

        * **Application Control Learning**: `3`

        * **Network Control Monitor**: `17`

        * **Storage Control Monitor**: `18`


        **OS Type IDs:**

        * **Windows**: `1`

        * **MAC**: `2`

        * **Linux**: `3`'
      requestBody:
        description: A DTO containing the device identifier and the maintenance mode settings to apply.
