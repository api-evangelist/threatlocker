openapi: 3.2.0
info:
  title: Portal System Audit API
  version: v1.0.0
security:
- Authorization: []
  ManagedOrganizationId: []
  OverrideManagedOrganizationId: []
tags:
- name: SystemAudit
paths:
  /portalapi/SystemAudit/SystemAuditGetForHealthCenter:
    post:
      tags:
      - SystemAudit
      summary: Retrieves System Audit data for the Health Center, specifically focused on…
      description: 'This endpoint retrieves a paginated list of audit records related to user login attempts,

        filtered by date range, search text, and whether the login was successful or denied.

        It can also filter by latitude and longitude if provided in the correct format within the search text.


        **Search Text Usage:**


        * **Standard Text Search:** You can enter countries, regions, or cities to search within the audit records.

        * **Latitude/Longitude Search:** To search by geographical location, use the format "lat:[latitude]&long:[longitude]".

        - For example, "lat:34.0522&long:-118.2437" will search for audit records near Los Angeles.


        **Sample request:**


        POST /SystemAuditGetForHealthCenter

        {

        "days": 30,

        "isLoggedIn": false,

        "pageSize": 25,

        "pageNumber": 1,

        "searchText": "lat:40.7128&long:-74.0060"

        }


        POST /SystemAuditGetForHealthCenter

        {

        "days": 30,

        "isLoggedIn": false,

        "pageSize": 25,

        "pageNumber": 1,

        "searchText": "United States"

        }


        POST /SystemAuditGetForHealthCenter

        {

        "days": 30,

        "isLoggedIn": false,

        "pageSize": 25,

        "pageNumber": 1,

        "emailAddress": "test.user@email.com"

        }


        POST /SystemAuditGetForHealthCenter

        {

        "days": 30,

        "isLoggedIn": false,

        "pageSize": 25,

        "pageNumber": 1,

        "ipAddresses": "123.123.123.123"

        }'
      requestBody:
        description: Parameters for filtering audit data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemAuditHealthCenterParams'
          text/json:
            schema:
              $ref: '#/components/schemas/SystemAuditHealthCenterParams'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SystemAuditHealthCenterParams'
      responses:
        '200':
          description: Successfully retrieved the Health Center audit data.
        '400':
          description: The request was malformed or invalid.
        '401':
          description: The user does not have the required permissions.
        '403':
          description: The user is not authorized to perform this action.
        '500':
          description: An unexpected error occurred on the server.
      operationId: postPortalapiSystemAuditSystemAuditGetForHealthCenter
      x-operation-id-source: derived
  /portalapi/SystemAudit/SystemAuditGetLoginAttemptFiltersForHealthCenter:
    get:
      tags:
      - SystemAudit
      summary: Retrieves unique emails and IP addresses from system audit data for login…
      description: '**Sample request:**


        GET /SystemAuditGetLoginAttemptFiltersForHealthCenter

        {

        "days": 30,

        "isLoggedIn": false,

        "pageSize": 25,

        "pageNumber": 1,

        "emailAddress": "test.user@email.com"

        }


        GET /SystemAuditGetLoginAttemptFiltersForHealthCenter

        {

        "days": 30,

        "isLoggedIn": false,

        "pageSize": 25,

        "pageNumber": 1,

        "ipAddresses": "123.123.123.123"

        }'
      parameters:
      - name: Days
        in: query
        schema:
          type: integer
          format: int32
          default: 30
      - name: SearchText
        in: query
        schema:
          type: string
          default: ''
      - name: IsLoggedIn
        in: query
        schema:
          type: boolean
          default: false
      - name: EmailAddress
        in: query
        schema:
          type: string
      - name: IPAddresses
        in: query
        schema:
          type: string
      - name: AfterKeys
        in: query
        schema:
          type: object
          additionalProperties:
            type:
            - array
            - 'null'
            items: {}
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: PageNumber
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        '200':
          description: Successfully retrieved the Health Center login attempt filters.
        '400':
          description: The request was malformed or invalid.
        '401':
          description: The user does not have the required permissions.
        '403':
          description: The user is not authorized to perform this action.
        '500':
          description: An unexpected error occurred on the server.
      operationId: getPortalapiSystemAuditSystemAuditGetLoginAttemptFiltersForHealthCenter
      x-operation-id-source: derived
  /portalapi/SystemAudit/SystemAuditGetByParameters:
    post:
      tags:
      - SystemAudit
      summary: Retrieves System Audit records based on specified parameters
      description: 'This endpoint retrieves a paginated list of System Audit records, allowing filtering by various parameters such as username, action, IP address, effective action, details, date range, and organization.


        **Filtering and Search:**


        * **Wildcard Search:** The `Details`, `IPAddress`, `EffectiveAction`, and `Username` fields support wildcard searches.

        - If the search text contains an asterisk (`*`), it will be replaced with a percent sign (`%`) for the SQL LIKE operator.

        - If the search text does not contain an asterisk (`*`), a percent sign (`%`) will be added to both the beginning and end of the search text by default (searching for "test" will become "%test%"). This means it will search for any records that *contain* the search text.

        * **Date Range:** Use `StartDate` and `EndDate` to filter records within a specific date range.

        * **Organization:** By default, the endpoint retrieves records for the current organization. Set `ViewChildOrganizations` to `true` to include child organizations in the search. If the user is logged into the Master Organization, it is not necessary to use `ViewChildOrganizations`.


        **Sample Request:**


        POST /portalApi/SystemAuditGetByParameters

        {

        "username": "*test*", OR "username": "test",

        "action": "Read",

        "ipAddress": "*",

        "effectiveAction": "Permitted",

        "details": "Viewed*",

        "startDate": "2023-01-01T00:00:00Z",

        "endDate": "2024-01-27T23:59:59Z",

        "pageSize": 25,

        "pageNumber": 1,

        "viewChildOrganizations": false,

        "objectId": "00000000-0000-0000-0000-000000000000"

        }

        **This request would search for:**

        - Usernames that contain "test" anywhere.

        - Any IP address.

        - Details that start with "Viewed".'
      requestBody:
        description: Parameters for filtering System Audit records.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemAuditParametersDto'
          text/json:
            schema:
              $ref: '#/components/schemas/SystemAuditParametersDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SystemAuditParametersDto'
      responses:
        '200':
          description: Successfully retrieved the System Audit records.
        '400':
          description: The request was malformed or invalid.
        '401':
          description: The user is not authenticated or does not have permission to view System Audit records.
        '403':
          description: The user is not authorized to perform this action.
        '500':
          description: An unexpected error occurred on the server.
      operationId: postPortalapiSystemAuditSystemAuditGetByParameters
      x-operation-id-source: derived
