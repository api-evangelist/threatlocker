apis:
- name: ThreatLocker PortalAPI
  description: >-
    Public REST API for the ThreatLocker Portal. 83 operations across 18 resource groups — ActionLog,
    Application, ApprovalRequest, Computer, ComputerCheckin, ComputerGroup, MaintenanceMode,
    OnlineDevices, Organization, Policy, Report, SaveSearch, ScheduledAgentAction, SystemAudit, Tag,
    ThreatLockerVersion, UploadRequest and VDIHyperV. Authentication is an API-key token created under
    Users > API Users in the portal and sent in the Authorization header; tenant scope is selected with
    a managedOrganizationId header. The host is instance-specific
    (https://portalapi.<INSTANCE>.threatlocker.com/portalapi/).
  humanURL: https://threatlocker.kb.help/api-documentation/
  baseURL: https://portalapi.threatlocker.com/portalapi/
