openapi: 3.2.0
info:
  title: Portal Upload Request API
  version: v1.0.0
security:
- Authorization: []
  ManagedOrganizationId: []
  OverrideManagedOrganizationId: []
tags:
- name: UploadRequest
paths:
  /portalapi/UploadRequest/UploadRequestInsert:
    post:
      tags:
      - UploadRequest
      summary: Insert Upload Request.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/UploadRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UploadRequestDto'
      responses:
        '200':
          description: OK
  /portalapi/UploadRequest/UploadRequestGet:
    post:
      tags:
      - UploadRequest
      summary: Get Upload Request.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/UploadRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UploadRequestDto'
      responses:
        '200':
          description: OK
components:
  schemas:
    UploadRequestDto:
      type: object
      properties:
        uploadRequestId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        computerId:
          type: string
          format: uuid
        shA256:
          type:
          - string
          - 'null'
        hash:
          type:
          - string
          - 'null'
        filename:
          type:
          - string
          - 'null'
        filepath:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Authorization:
      type: apiKey
      description: Please insert Standard Authorization header.
      name: Authorization
      in: header
    ManagedOrganizationId:
      type: apiKey
      description: Please insert Managed Organization Id.
      name: ManagedOrganizationId
      in: header
    OverrideManagedOrganizationId:
      type: apiKey
      description: Please insert Managed Organization Id.
      name: OverrideManagedOrganizationId
      in: header
