aid: threatlocker
name: ThreatLocker
description: >-
  ThreatLocker is a Zero Trust endpoint and cloud security platform used by enterprises and managed
  service providers to enforce least privilege across endpoints, networks, and cloud workloads. Its
  capabilities include Application Control (allowlisting), Ringfencing, Elevation Control, Storage
  Control, Network Control / ZTNA, Web Content Control, Patch Management, and ThreatLocker Detect
  (managed detection and response). The multi-tenant ThreatLocker Portal is exposed programmatically
  through the PortalAPI — a public OpenAPI 3.0 REST contract covering action logs, applications,
  approval requests, computers and computer groups, maintenance mode, organizations, policies,
  reports, saved searches, scheduled agent actions, system audit, tags, upload requests, and agent
  versions. The platform is deployed as regionally isolated instances (A–H plus AE1, AU1, CA1, EU1,
  SA1 and a FedRAMP instance), so both the portal and the API are addressed per instance.
